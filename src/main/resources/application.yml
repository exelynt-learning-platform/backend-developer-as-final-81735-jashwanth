spring:
  application:
    name: resource-booking-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resource_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQVNlY3VyZVN1ZmZpY2llbnRMb25nSldUSFNlY3JldEZvckRldmVsb3BtZW50MTIzNDU2Nzg5}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
